<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Rich Emerald Gradient (Matches Urmira Brand Identity) -->
    <linearGradient id="urmiraEmeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#054231" />
      <stop offset="50%" stop-color="#065f46" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    
    <!-- Subtle Ambient Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#054231" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Circular Emerald Disc -->
  <circle cx="64" cy="64" r="60" fill="url(#urmiraEmeraldGrad)" filter="url(#softGlow)" />
  
  <!-- Subtle Top-Gloss Rim -->
  <circle cx="64" cy="64" r="58.5" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2.5" />

  <!-- Organic Handcrafted White Leaf Path (Pure & Clean) -->
  <g transform="translate(64,64) rotate(-15) translate(-64,-64)">
    <!-- Main Leaf Body -->
    <path 
      d="M40 88 C40 88 44 48 88 40 C88 40 84 80 40 88 Z" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="7" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Center Leaf Rib / Spine -->
    <path 
      d="M40 88 C54 74 68 60 88 40" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="6" 
      stroke-linecap="round"
    />
    <!-- Subtle Bottom Stem Curve -->
    <path 
      d="M40 88 C36 94 32 98 28 100" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="6" 
      stroke-linecap="round"
    />
  </g>
</svg>
